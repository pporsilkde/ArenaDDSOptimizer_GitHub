name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake --preset release
      - name: Build
        shell: pwsh
        run: cmake --build --preset release --parallel
      - name: Package portable build
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path package/windows/* -DestinationPath ArenaDDSOptimizer-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaDDSOptimizer-Windows-x64
          path: ArenaDDSOptimizer-Windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          install-deps: true
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev file wget
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Prepare AppDir
        run: ./scripts/package_linux.sh
      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
      - name: Build AppImage
        env:
          LINUXDEPLOY_OUTPUT_VERSION: ${{ github.ref_name }}
        run: |
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir package/linux/ArenaDDSOptimizer.AppDir \
            --desktop-file resources/ArenaDDSOptimizer.desktop \
            --icon-file resources/ArenaDDSOptimizer.svg \
            --plugin qt \
            --output appimage
          mv Arena_DDS_Optimizer-*.AppImage ArenaDDSOptimizer-Linux-x86_64.AppImage 2>/dev/null || \
          mv ArenaDDSOptimizer-*.AppImage ArenaDDSOptimizer-Linux-x86_64.AppImage 2>/dev/null || \
          mv ./*.AppImage ArenaDDSOptimizer-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaDDSOptimizer-Linux-x86_64
          path: ArenaDDSOptimizer-Linux-x86_64.AppImage
          if-no-files-found: error
