name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  DIRECTXTEX_TAG: 'may2026'

jobs:
  windows:
    name: Windows x64 portable + bundled texconv
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Build DirectXTex texconv
        shell: pwsh
        run: ./scripts/build_directxtex.ps1 -Tag "${{ env.DIRECTXTEX_TAG }}"
      - name: Configure Arena DDS Optimizer
        shell: pwsh
        run: cmake --preset release
      - name: Build Arena DDS Optimizer
        shell: pwsh
        run: cmake --build --preset release --parallel
      - name: Package portable build
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Verify portable contents
        shell: pwsh
        run: |
          if (-not (Test-Path package/windows/ArenaDDSOptimizer.exe)) { throw "ArenaDDSOptimizer.exe missing" }
          if (-not (Test-Path package/windows/texconv.exe)) { throw "texconv.exe missing" }
          & package/windows/texconv.exe --version
      - name: Create ZIP
        shell: pwsh
        run: 7z a -tzip -mx=9 ArenaDDSOptimizer-Windows-x64.zip ./package/windows/*
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaDDSOptimizer-Windows-x64
          path: ArenaDDSOptimizer-Windows-x64.zip
          if-no-files-found: error
