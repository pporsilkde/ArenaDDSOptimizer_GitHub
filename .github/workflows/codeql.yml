name: CodeQL Windows

on:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  security-events: write
  packages: read
  contents: read

env:
  QT_VERSION: '6.8.3'

jobs:
  analyze:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
      - shell: pwsh
        run: cmake --preset release
      - shell: pwsh
        run: cmake --build --preset release --parallel 2
      - uses: github/codeql-action/analyze@v3
