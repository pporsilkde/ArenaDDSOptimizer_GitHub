name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'
  DIRECTXTEX_TAG: 'may2026'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Build DirectXTex texconv
        shell: pwsh
        run: ./scripts/build_directxtex.ps1 -Tag "${{ env.DIRECTXTEX_TAG }}"
      - name: Configure
        shell: pwsh
        run: cmake --preset release
      - name: Build
        shell: pwsh
        run: cmake --build --preset release --parallel
      - name: Package
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Verify texconv
        shell: pwsh
        run: |
          if (-not (Test-Path package/windows/texconv.exe)) { throw "texconv.exe missing" }
          & package/windows/texconv.exe --version
      - name: Create release ZIP
        shell: pwsh
        run: 7z a -tzip -mx=9 ArenaDDSOptimizer-${{ github.ref_name }}-Windows-x64.zip ./package/windows/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" "ArenaDDSOptimizer-$env:GITHUB_REF_NAME-Windows-x64.zip" --generate-notes --title "Arena DDS Optimizer $env:GITHUB_REF_NAME"
