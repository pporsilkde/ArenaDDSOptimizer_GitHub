name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel
      - shell: pwsh
        run: ./scripts/package_windows.ps1
      - shell: pwsh
        run: Compress-Archive -Path package/windows/* -DestinationPath ArenaDDSOptimizer-${{ github.ref_name }}-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ArenaDDSOptimizer-${{ github.ref_name }}-Windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          install-deps: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev file wget
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel
      - run: ./scripts/package_linux.sh
      - run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir package/linux/ArenaDDSOptimizer.AppDir \
            --desktop-file resources/ArenaDDSOptimizer.desktop \
            --icon-file resources/ArenaDDSOptimizer.svg \
            --plugin qt \
            --output appimage
          found="$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy*' | head -n 1)"
          mv "$found" "ArenaDDSOptimizer-${GITHUB_REF_NAME}-Linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ArenaDDSOptimizer-${{ github.ref_name }}-Linux-x86_64.AppImage

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "Arena DDS Optimizer ${GITHUB_REF_NAME}"
